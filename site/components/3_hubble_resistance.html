    <p>
        <!-- Hubble's obsessive quotation marks around "velocity" in the 1929
             paper. His explicit plea that the redshift might express "some
             hitherto unrecognized principle of nature." The data gave a
             linear relation; the interpretation was appended by others. -->
    </p>

    <p>
        <!-- The direct test of expansion: galaxies came out too bright,
             favoring a static universe. How "evolutionary corrections" were
             invented to bury the result. -->
    </p>
